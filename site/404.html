<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Hugo Ninclaus</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap">
<!--
  Styles écrits ici (et pas dans assets/) : cette page peut être servie
  depuis n'importe quelle adresse, les chemins relatifs n'y sont pas fiables.
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 22px;
    background: #000;
    color: #f5f5f7;
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .box { width: 100%; max-width: 1080px; margin: 0 auto; }
  p.code { margin: 0 0 20px; font-family: "JetBrains Mono", monospace; color: #2997ff; }
  h1 {
    margin: 0;
    font-size: clamp(2.6rem, 7vw, 5.4rem);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }
  h1 span { color: #6e6e73; }
  a {
    display: inline-block;
    margin-top: 44px;
    padding: 13px 26px;
    border-radius: 980px;
    background: #2997ff;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  a:hover { background: #0077ed; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">HTTP/1.0 404 Not Found</p>
    <h1>Rien ici.<br><span>Même mon serveur en C l'aurait dit.</span></h1>
    <a href="/" id="accueil">Retour à l'accueil</a>
  </div>
<script>
  // Sur GitHub Pages le site est dans un sous-dossier (/nom-du-repo/) :
  // on renvoie vers la racine de ce sous-dossier.
  if (location.hostname.endsWith("github.io")) {
    var dossier = location.pathname.split("/")[1];
    document.getElementById("accueil").href = "/" + (dossier ? dossier + "/" : "");
  }
</script>
</body>
</html>

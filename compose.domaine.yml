# Mise en ligne avec un vrai domaine et HTTPS automatique.
#
# Caddy se place devant le portfolio : il reçoit les visiteurs sur les
# ports 80 et 443, récupère tout seul un certificat Let's Encrypt pour
# le domaine, et transmet les requêtes au conteneur nginx.
#
# Sur le serveur :
#   DOMAINE=ninclaus.fr docker compose -f compose.yml -f compose.domaine.yml up -d --build
#
# Prérequis (détails dans le README) :
#   - le domaine (et www.) pointe vers l'IP publique du serveur
#   - les ports 80 et 443 arrivent bien jusqu'au serveur (redirection sur la box)

services:
  portfolio:
    ports: !reset []      # plus besoin d'exposer 8080, Caddy parle au conteneur directement

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - portfolio
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE: ${DOMAINE:?Indique le domaine, ex. DOMAINE=ninclaus.fr}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats : à garder entre deux redémarrages
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

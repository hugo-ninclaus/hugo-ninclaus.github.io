# Configuration nginx du portfolio (image Docker).
# Copiée dans /etc/nginx/conf.d/default.conf par le Dockerfile.

# Durée de cache selon le type de fichier.
# HTML, CSS et JS : le navigateur revérifie à chaque visite (réponse 304
# si rien n'a changé), comme ça une modif du site est visible tout de suite.
map $sent_http_content_type $cache {
    default                 off;
    text/html               epoch;
    text/css                epoch;
    ~javascript             epoch;
    ~image/                 7d;
    application/pdf         1d;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    expires $cache;

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;

    # --- En-têtes de sécurité ---
    # CSP : uniquement nos fichiers + Google Fonts.
    # Le petit script en ligne de 404.html est bloqué ici, c'est voulu :
    # il ne sert que sur GitHub Pages.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fichiers de l'ancien portfolio : on redirige vers les nouvelles pages
    location = /about.html    { return 301 /#parcours; }
    location = /contact.html  { return 301 /#contact; }
    location = /projects.html { return 301 /#projets; }
    location = /projects/miniserveur.html       { return 301 /projet.html?p=miniserveur; }
    location = /projects/projet-fils-rouge.html { return 301 /projet.html?p=neopark; }
    location = /projects/redesign-monster.html  { return 301 /projet.html?p=monster; }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Healthcheck Docker
    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
